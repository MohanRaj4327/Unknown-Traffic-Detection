# Server configuration
server.port=8080

# PHASE 12: Database Configuration (e.g. Supabase PostgreSQL)
# To connect your cloud database, paste your Supabase JDBC connection string here:
spring.datasource.url=${DB_URL:jdbc:postgresql://YOUR_SUPABASE_HOST:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:YOUR_SUPABASE_PASSWORD}

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Paper-inspired Adaptive Threshold Selection (ATS) Defaults
# Make configurable per instructions
ccsutd.model.alpha-0=0.9
ccsutd.model.ats.S=15
ccsutd.model.ats.percentile=10
# Usually beta = alpha, but we can allow explicit override or fallback to alpha
ccsutd.model.beta=0.9
