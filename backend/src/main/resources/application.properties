# Server configuration
server.port=8080

# Database Configuration (Supabase PostgreSQL or similar)
# Replace with actual credentials via environment variables later
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ccsutd_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Paper-inspired Adaptive Threshold Selection (ATS) Defaults
# Make configurable per instructions
ccsutd.model.alpha-0=0.9
ccsutd.model.ats.S=15
ccsutd.model.ats.percentile=10
# Usually beta = alpha, but we can allow explicit override or fallback to alpha
ccsutd.model.beta=0.9
